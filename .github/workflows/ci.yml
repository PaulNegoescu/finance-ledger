name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U ledger -d ledger_test" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      TEST_DATABASE_URL: postgres://ledger:synthetic-ci-only@localhost:5432/ledger_test
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
